<!doctype html>
<html lang="pt-PT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL2KeyFill · Diagnóstico AV automático</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style>
<canvas id="picture" aria-label="Diagnóstico automático de imagem e som"></canvas>
<!-- Generated by tools/av-test/generate.py. No interaction or external resources required. -->
<script>
'use strict';
(()=>{
const mode="gray",canvas=document.getElementById('picture'),g=canvas.getContext('2d');
const definitions={
 bars:{name:'BARRAS RGB',pattern:'bars',sound:'silence',hint:'Branco · amarelo · ciano · verde · magenta · vermelho · azul · preto'},
 gray:{name:'ESCALA DE CINZENTOS',pattern:'gray',sound:'silence',hint:'16 níveis · verificar detalhe nos pretos e nos brancos'},
 grid:{name:'GEOMETRIA E MOVIMENTO',pattern:'grid',sound:'silence',hint:'Círculo sem deformação · margem 5% · linhas de 1 px · movimento contínuo'},
 alpha:{name:'TRANSPARÊNCIA / KEY',pattern:'alpha',sound:'silence',hint:'Fundo transparente · comparar FILL e KEY no misturador'},
 left:{name:'ÁUDIO · SÓ ESQUERDO',pattern:'bars',sound:'left',hint:'L: 1 kHz / −18 dBFS pico · R: silêncio'},
 right:{name:'ÁUDIO · SÓ DIREITO',pattern:'bars',sound:'right',hint:'L: silêncio · R: 1 kHz / −18 dBFS pico'},
 stereo:{name:'ÁUDIO · ESTÉREO EM FASE',pattern:'bars',sound:'stereo',hint:'L = R · 1 kHz / −18 dBFS pico por canal'},
 phase:{name:'ÁUDIO · OPOSIÇÃO DE FASE',pattern:'bars',sound:'phase',hint:'L = −R · 1 kHz / −18 dBFS pico · deve cancelar em MONO'},
 sweep:{name:'ÁUDIO · VARRIMENTO',pattern:'gray',sound:'sweep',hint:'20 Hz → 20 kHz · 16 s · −18 dBFS pico · L = R'},
 sync:{name:'SINCRONISMO AV',pattern:'sync',sound:'sync',hint:'Flash + impulso de 40 ms a cada segundo · medir no recetor'},
 silence:{name:'SILÊNCIO DIGITAL',pattern:'grid',sound:'silence',hint:'L = R = 0 · procurar ruído a jusante'}
};
const order=['bars','left','right','stereo','phase','gray','grid','alpha','sweep','sync','silence'];
const stages=(mode==='auto'?order:[mode]).map(key=>({...definitions[key],key,duration:key==='sweep'?16:8}));
const duration=stages.reduce((sum,s)=>sum+s.duration,0),rate=48000,amp=10**(-18/20);
let ctx,source,analysers=[],audioStart=0,error='',frames=0,last=0,intervals=[],maxGap=0,fps=0,statsAt=0;
const epoch=performance.now();
function stageAt(t){let offset=0;for(let index=0;index<stages.length;index++){const s=stages[index];if(t<offset+s.duration)return {s,index,local:t-offset};offset+=s.duration;}return {s:stages[0],index:0,local:0};}
function sample(t,sound,channel,length){
 if(sound==='silence'||sound==='left'&&channel===1||sound==='right'&&channel===0)return 0;
 let v=0;
 if(sound==='sync'){const u=t%1;v=u<.04?Math.sin(2*Math.PI*1000*u)*Math.max(0,Math.min(1,u/.002,(.04-u)/.002)):0;}
 else if(sound==='sweep'){const k=Math.log(1000)/length;v=Math.sin(2*Math.PI*20*Math.expm1(k*t)/k)*Math.max(0,Math.min(1,t/.005,(length-t)/.005));}
 else v=Math.sin(2*Math.PI*1000*t)*Math.max(0,Math.min(1,t/.005,(length-t)/.005));
 return amp*v*(sound==='phase'&&channel===1?-1:1);
}
async function start(){
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Web Audio indisponível');
  ctx=new Audio({sampleRate:rate});ctx.destination.channelCount=2;ctx.destination.channelCountMode='explicit';ctx.destination.channelInterpretation='discrete';
  const buffer=ctx.createBuffer(2,rate*duration,rate);
  // Generate each stage once, ahead of playback: no timer-driven audio switching.
  for(let channel=0;channel<2;channel++){const data=buffer.getChannelData(channel);let offset=0;for(const s of stages){for(let i=0;i<rate*s.duration;i++)data[offset+i]=sample(i/rate,s.sound,channel,s.duration);offset+=rate*s.duration;}}
  source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;source.connect(ctx.destination);
  const splitter=ctx.createChannelSplitter(2);source.connect(splitter);
  analysers=[0,1].map(channel=>{const node=ctx.createAnalyser();node.fftSize=2048;splitter.connect(node,channel);return {node,data:new Float32Array(node.fftSize)};});
  audioStart=ctx.currentTime+.1;source.start(audioStart);
  await ctx.resume();
 }catch(e){error=e.message;}
}
function sourceLevels(){
 return [0,1].map(channel=>{
  const meter=analysers[channel];if(!meter||ctx?.state!=='running')return null;
  meter.node.getFloatTimeDomainData(meter.data);let sum=0,peak=0;
  for(const value of meter.data){sum+=value*value;peak=Math.max(peak,Math.abs(value));}
  return {rms:sum>0?10*Math.log10(sum/meter.data.length):-Infinity,peak:peak>0?20*Math.log10(peak):-Infinity};
 });
}
function clock(){// Keep the visual diagnostic alive if autoplay is blocked.
 return ctx?.state==='running'?Math.max(0,ctx.currentTime-audioStart)%duration:Math.max(0,(performance.now()-epoch)/1000)%duration;
}
function text(s,x,y,size=24,color='#e9f4ff'){g.fillStyle=color;g.font=`${size}px system-ui, sans-serif`;g.fillText(s,x,y);}
function bars(x,y,w,h){['#fff','#ff0','#0ff','#0f0','#f0f','#f00','#00f','#000'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(x+i*w/8,y,w/8+1,h);});}
function gray(x,y,w,h){for(let i=0;i<16;i++){g.fillStyle=`rgb(${i*17},${i*17},${i*17})`;g.fillRect(x+i*w/16,y,w/16+1,h);}}
function draw(now){
 const w=canvas.width,h=canvas.height,t=clock(),{s,index,local}=stageAt(t),top=h*.26,bottom=h*.79,area=bottom-top,font=w/60;
 g.clearRect(0,0,w,h);if(s.pattern!=='alpha'){g.fillStyle='#081421';g.fillRect(0,0,w,h);}
 if(s.pattern==='bars')bars(w*.04,top,w*.92,area);
 if(s.pattern==='gray')gray(w*.04,top,w*.92,area);
 if(s.pattern==='alpha')for(let i=0;i<5;i++){const x=w*(.04+i*.184);g.fillStyle=`rgba(255,255,255,${i/4})`;g.fillRect(x,top,w*.176,area);g.fillStyle='#081421';g.fillRect(x,top+area*.8,w*.176,area*.2);text(`${i*25}%`,x+w*.015,bottom-area*.04,font,'#ffb454');}
 if(s.pattern==='grid'){
  g.strokeStyle='#506b81';g.lineWidth=1;for(let x=0;x<=16;x++){g.beginPath();g.moveTo(w*x/16,top);g.lineTo(w*x/16,bottom);g.stroke();}for(let y=0;y<=8;y++){g.beginPath();g.moveTo(0,top+area*y/8);g.lineTo(w,top+area*y/8);g.stroke();}
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(w/2,(top+bottom)/2,Math.min(area*.44,w*.2),0,2*Math.PI);g.stroke();
  for(let x=Math.round(w*.78);x<w*.95;x++){g.fillStyle=x%2?'#fff':'#000';g.fillRect(x,top+area*.2,1,area*.6);}
 }
 const audioRunning=ctx?.state==='running'&&!error;
 if(s.pattern==='sync'){
  // Never label a flash as an AV reference when the audio clock is not running.
  const flash=audioRunning&&ctx.currentTime>=audioStart&&local%1<.04;
  g.fillStyle=flash?'#fff':'#172a3c';g.fillRect(w*.34,top,w*.32,area);
  text(audioRunning?'FLASH + IMPULSO · 1 Hz':'SEM REFERÊNCIA AV · áudio indisponível',w*.06,bottom-area*.05,font);
 }else{g.fillStyle='#ffb454';g.fillRect(w*.04+w*.88*(local%4/4),h*.82,w*.04,h*.02);}
 // Read-only identification; all controls live in the host application.
 g.fillStyle='#071321';g.fillRect(w*.02,h*.025,w*.96,h*.19);
 text('URL2KeyFill / '+(mode==='auto'?'CICLO AUTOMÁTICO':'TESTE CONTÍNUO'),w*.04,h*.065,font,'#8ac4dd');
 text(s.name,w*.04,h*.12,w/36);
 text(s.hint,w*.04,h*.17,font);
 const remaining=Math.max(0,s.duration-local),next=stages[(index+1)%stages.length];
 const ready=audioRunning&&ctx.currentTime>=audioStart;
 const expected=s.sound==='silence'?'SILÊNCIO DIGITAL · intencional':s.sound==='left'?'SINAL PREVISTO · só L':s.sound==='right'?'SINAL PREVISTO · só R':s.sound==='sync'?'SINAL PREVISTO · impulsos L + R':'SINAL PREVISTO · L + R';
 const status=error||(!ctx?'A iniciar motor de áudio':ctx.state!=='running'?`MOTOR ${ctx.state.toUpperCase()} · verificar autoplay no host`:!ready?'A preparar sinal':expected);
 const levels=sourceLevels(),db=value=>Number.isFinite(value)?value.toFixed(1):'−∞';
 const measured=levels.map((level,i)=>`${i?'R':'L'} ${level?db(level.rms)+' dBFS RMS / '+db(level.peak)+' pico':'indisponível'}`).join(' · ');
 g.fillStyle='#071321';g.fillRect(w*.02,h*.87,w*.96,h*.11);
 text(`${mode==='auto'?`${index+1}/${stages.length} · próximo: ${next.name}`:'Repete automaticamente'} · ${remaining.toFixed(1)} s`,w*.04,h*.902,font);
 text(`${status} · ${w} × ${h} · ${fps.toFixed(1)} FPS rAF · intervalo máx. ${maxGap.toFixed(1)} ms · ${ctx?.sampleRate||'—'} Hz`,w*.04,h*.938,w/82,audioRunning?'#77e3c0':'#ffb454');
 text(`Fonte medida: ${measured} · antes da app / SDI`,w*.04,h*.969,w/82,'#b7cbdc');
 g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);g.strokeStyle='#ffb454';g.setLineDash([8,8]);g.strokeRect(w*.05,h*.05,w*.9,h*.9);g.setLineDash([]);
 frames++;if(last){const gap=now-last;intervals.push(gap);if(intervals.length>120)intervals.shift();maxGap=Math.max(maxGap,gap);}last=now;
 if(now-statsAt>500){fps=intervals.length?1000/(intervals.reduce((a,b)=>a+b,0)/intervals.length):0;statsAt=now;}
 requestAnimationFrame(draw);
}
function resize(){canvas.width=Math.max(1,Math.round(innerWidth*devicePixelRatio));canvas.height=Math.max(1,Math.round(innerHeight*devicePixelRatio));}
addEventListener('resize',resize);resize();
window.avTest={mode,stages,duration,stageAt,sample,sourceLevels,clock,get context(){return ctx;}};
start();requestAnimationFrame(draw);
})();
</script>
</html>
