<!doctype html><html lang="en"><meta charset="utf-8"><title>URL2KeyFill · alpha test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}*{box-sizing:border-box}
.frame{position:absolute;inset:1px;border:2px solid #fff}.corner{position:absolute;padding:14px;font-size:22px;background:#102840}.tr{right:0;top:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
.card{position:absolute;left:8%;top:22%;width:64%;padding:3%;background:rgba(12,30,52,.75);border-radius:24px;box-shadow:0 20px 55px #0009}
h1{font-size:clamp(24px,4vw,100px);margin:0 0 20px}p{font-size:clamp(14px,2vw,42px)}.samples{display:flex;gap:16px}.sample{width:16%;aspect-ratio:1;background:#00caff;display:grid;place-items:center;color:black;font-size:24px}
.gradient{height:45px;background:linear-gradient(90deg,transparent,#fff);margin-top:20px}.circle{position:absolute;right:6%;top:32%;width:14%;aspect-ratio:1;border:8px solid #ffb030;border-radius:50%}.moving{position:absolute;bottom:12%;width:5%;height:4%;background:#ff5070;animation:travel 4s linear infinite alternate}@keyframes travel{from{left:5%}to{left:90%}}
</style><div class="frame"></div><div class="corner">1 · TOP / LEFT</div><div class="corner tr">2 · TOP / RIGHT</div><div class="corner bl">3 · BOTTOM / LEFT</div><div class="corner br">4 · BOTTOM / RIGHT</div>
<div class="card"><h1>URL2KeyFill</h1><p>Transparency · shadows · text Aa 0123456789</p><div class="samples"><div class="sample" style="opacity:0">0</div><div class="sample" style="opacity:.25">25%</div><div class="sample" style="opacity:.5">50%</div><div class="sample" style="opacity:.75">75%</div><div class="sample">100%</div></div><div class="gradient"></div></div><div class="circle"></div><div class="moving"></div>
<!-- Exact pixel probes outside the card for automated OSR tests. -->
<div style="position:absolute;left:100px;top:70px;width:20px;height:20px;background:rgba(255,0,0,.5)"></div>
<div style="position:absolute;left:130px;top:70px;width:20px;height:20px;background:rgb(0,255,0)"></div>
<script>
(()=>{
 // Left: original moving tone. Right: one click per second, alternating 12 dB in level.
 // The generated sound is embedded in this page; no remote media is required.
 const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;
 const context=new Context(),duration=8,buffer=context.createBuffer(2,Math.round(context.sampleRate*duration),context.sampleRate),left=buffer.getChannelData(0),right=buffer.getChannelData(1);
 for(let i=0;i<buffer.length;i++){
  const t=i/context.sampleRate,position=t<=4?t/4:2-t/4,u=t-4;
  const cycles=t<=4?220*t+82.5*t*t:2200+880*u-82.5*u*u;
  const envelope=.16*(.15+.85*Math.sin(Math.PI*position)**2)*(.6+.4*Math.sin(4*Math.PI*t)**2),sample=Math.sin(2*Math.PI*cycles)*envelope;
  left[i]=sample*Math.cos(position*Math.PI/2);
  const second=Math.floor(t),clickTime=t-second,level=second%2===0?.5:.125;
  right[i]=clickTime<.025?level*Math.sin(2*Math.PI*2000*clickTime)*(1-Math.exp(-clickTime/.0003))*Math.exp(-clickTime/.003):0;
 }
 const source=context.createBufferSource();source.buffer=buffer;source.loop=true;source.connect(context.destination);const startedAt=context.currentTime+.03;source.start(startedAt);
 const moving=document.querySelector('.moving');
 function sync(){if(context.state==='running'){const t=Math.max(0,context.currentTime-startedAt)%duration,position=t<=4?t/4:2-t/4;moving.style.animation='none';moving.style.left=(5+85*position)+'%';}requestAnimationFrame(sync);}requestAnimationFrame(sync);
 context.resume().catch(()=>{});document.addEventListener('pointerdown',()=>context.resume().catch(()=>{}));
 window.basicTestAudio={context,source,startedAt,duration};
})();
</script>
</html>
